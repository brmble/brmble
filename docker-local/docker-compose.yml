services:
  mumble:
    container_name: mumble
    image: 'mumblevoip/mumble-server:latest'
    ports:
      - '1911:1911'
      - '1911:1911/udp'
    volumes:
      - mumble-data:/data
    restart: unless-stopped
    environment:
      MUMBLE_CONFIG_WELCOMETEXT: "<br />Finaly updated the one and only linux mumble servert <b>noscope.it</b>.<br />Enjoy your stay!<br />  <!--brmble:{'apiUrl':'https://localhost:1912'}-->"
      MUMBLE_CONFIG_PORT: "1911"
      MUMBLE_CONFIG_ALLOWHTML: "true"
      MUMBLE_ACCEPT_UNKNOWN_SETTINGS: "true"
      MUMBLE_CONFIG_IMAGEMESSAGELENGTH: "0"
      MUMBLE_CONFIG_TEXTMESSAGELENGTH: "0"
      MUMBLE_CONFIG_ICE: "tcp -h 0.0.0.0 -p 6502"

  brmble:
    container_name: mumble-brmble
    build:
      context: ..
      dockerfile: src/Brmble.Server/Dockerfile
      args:
        SOURCE_REVISION_ID: ${SOURCE_REVISION_ID:-}
    ports:
      - "1912:8080"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - brmble-data:/data
    environment:
      MATRIX_SERVER_NAME: '${MATRIX_SERVER_NAME}'
      MATRIX_APPSERVICE_TOKEN: '${MATRIX_APPSERVICE_TOKEN}'
      Matrix__AppServiceToken: '${MATRIX_APPSERVICE_TOKEN}'
      Ice__Host: mumble
      LIVEKIT_NODE_IP: '127.0.0.1'
      Games__RealtimePublicWebSocketUrl: 'wss://localhost:1912/games/realtime'
      Games__RealtimeAllowedOrigins__0: 'https://brmble.local'
      Games__RealtimeAllowedOrigins__1: 'http://localhost:5173'
      # Local testing aid, Development only. Shifts the wall clock the server stamps
      # snapshots with, so realtime games can be tested against a client whose clock
      # disagrees - which on one machine is otherwise impossible, since both sides
      # read the same clock. Uncomment, rebuild, and the arena should still play
      # normally; if it does not, the client's clock-offset correction is broken.
      # Simulation timing is untouched: only the timestamp label moves.
      # Games__DevClockSkewMs: '-400'
    restart: unless-stopped
    depends_on:
      - mumble

volumes:
  mumble-data:
  brmble-data:
